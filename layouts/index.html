{{ define "main" }}
<section class="hero">
  <h1>{{ .Site.Title }}</h1>
  <p>{{ .Site.Params.tagline }}</p>
</section>

<section class="content">
  {{ .Content }}
</section>

<section class="project-preview">
  <h2>Projects</h2>
  <div class="grid">
    {{ range first 6 (where .Site.RegularPages "Type" "projects") }}
    <a class="card" href="{{ .RelPermalink }}">
      <h3>{{ .Title }}</h3>
      <p>{{ .Params.summary | default .Summary }}</p>
    </a>
    {{ end }}
  </div>
  <p><a href="{{ "/projects/" | relURL }}">View all projects &rarr;</a></p>
</section>
{{ end }}
