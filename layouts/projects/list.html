{{ define "main" }}
<span class="section-label">Projects</span>
<h1>{{ .Title }}</h1>
<div class="projects-intro">{{ .Content }}</div>
<div class="grid">
  {{ range .Pages }}
  <a class="card" href="{{ .RelPermalink }}">
    <h3>{{ .Title }}</h3>
    <p class="summary">{{ .Params.summary | default .Summary }}</p>
    <div class="meta">
      {{ with .Params.language }}<span>{{ . }}</span>{{ end }}
      {{ with .Params.license }}<span>{{ . }}</span>{{ end }}
    </div>
  </a>
  {{ end }}
</div>
{{ end }}
