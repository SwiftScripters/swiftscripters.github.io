{{ define "main" }}
<article class="project">
  <span class="section-label">Projects</span>
  <h1>{{ .Title }}</h1>
  <p class="meta-line">
    {{ with .Params.language }}<span>{{ . }}</span>{{ end }}
    {{ with .Params.license }}<span>{{ . }} license</span>{{ end }}
  </p>
  {{ with .Params.repo }}<a class="repo-link" href="{{ . }}" target="_blank" rel="noopener">View source on GitHub &rarr;</a>{{ end }}
  {{ .Content }}
</article>
{{ end }}
